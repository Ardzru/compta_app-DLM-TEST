<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Import Comptabilité</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 600px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        button {
            margin-top: 20px;
            padding: 15px 30px;
            background: #0078ff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            cursor: pointer;
        }
        button:disabled {
            background: #999;
            cursor: not-allowed;
        }
        .hint {
            margin-top: 20px;
            font-size: 0.9em;
            color: #555;
        }
        pre {
            background: #eee;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Import Comptabilité</h1>

    <p>Les fichiers suivants seront traités automatiquement :</p>

    <pre>
C:\Users\Matth\Documents\compta_app\fichiers_brut
    </pre>

    <form action="/traiter" method="POST" onsubmit="desactiverBouton()">
        <button id="btn-traiter" type="submit">Traiter le dossier</button>
    </form>

    <div class="hint">
        AMEX • ALMA • ANCV • BANQUE • TA • AVOIRS • KIOSK PHOTO LUGE
    </div>
</div>

<footer style="
    margin-top: 40px;
    text-align: center;
    font-size: 0.85em;
    color: #999;
    font-style: italic;
">
    Application créée par Matthias Carvalho
</footer>

<script>
function desactiverBouton() {
    const btn = document.getElementById("btn-traiter");
    btn.disabled = true;
    btn.innerText = "Traitement en cours...";
}
</script>

</body>
</html>
