name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --noconsole --name ComptaApp `
            --hidden-import ui `
            --hidden-import ui.main_window `
            --hidden-import core `
            --hidden-import core.dispatcher `
            --hidden-import handlers `
            --hidden-import utils `
            app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ComptaApp-exe
          path: dist/ComptaApp.exe
